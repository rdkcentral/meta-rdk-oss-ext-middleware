server:
    # Phase 1: loopback-only listener behind dnsmasq
    interface: 127.0.0.1
    port: 5353

    # Only local processes (dnsmasq) may query Unbound
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::1 allow
    access-control: ::/0 refuse

    # Embedded RDK: no chroot
    chroot: ""
    pidfile: "/run/unbound/unbound.pid"

    username: "unbound"
    directory: "/etc/unbound"

    # Cache tuning (measure cache effectiveness in Phase 1)
    cache-min-ttl: 300
    cache-max-ttl: 86400
    prefetch: yes
    serve-expired: yes
    serve-expired-ttl: 604800
    serve-expired-client-timeout: 0

    # DNSSEC validation
    module-config: "validator iterator"
    auto-trust-anchor-file: "/var/lib/unbound/root.key"
    val-clean-additional: yes

    # Performance (single thread on embedded)
    num-threads: 1

    # Logging
    verbosity: 1

    do-ip4: yes
    do-ip6: yes

    # Security basics
    hide-identity: yes
    hide-version: yes

# Upstream forwarders (static for Phase 1 manual testing)
include: "/etc/unbound/forwarders.conf"

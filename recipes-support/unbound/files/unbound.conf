server:
    # Listen on loopback only for local clients, including dnsmasq.
    interface: 127.0.0.1
    # Use port 5300: dnsmasq uses 53, and mDNS uses UDP port 5353.
    port: 5300

    # Allow localhost clients; refuse all other IPv4 and IPv6 clients.
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse
    access-control: ::1 allow
    access-control: ::/0 refuse

    # Disable filesystem isolation via chroot; use normal filesystem paths.
    chroot: ""
    # Store the running Unbound process ID in this file.
    pidfile: "/run/unbound/unbound.pid"

    username: "unbound"
    directory: "/etc/unbound"

    # Cache lifetimes in seconds.
    cache-min-ttl: 300
    cache-max-ttl: 86400
    # Refresh popular cached answers near expiry.
    prefetch: yes
    # Serve expired answers immediately while refreshing.
    serve-expired: yes
    serve-expired-ttl: 604800
    serve-expired-client-timeout: 0

    # DNSSEC validation disabled; recursive resolution remains enabled.
    module-config: "iterator"
    # To enable DNSSEC, replace the line above and provision a writable root trust anchor.
    # module-config: "validator iterator"
    # auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Performance (single thread on embedded)
    num-threads: 1

    # Logging
    verbosity: 3

    do-ip4: yes
    do-ip6: yes

    # Security basics
    hide-identity: yes
    hide-version: yes
    # Recursive resolution is the default when forwarding is not configured.
    # Use the supplied root-server hints instead of built-in hints.
    root-hints: "/etc/unbound/root.hints"

# Uncomment the following lines to use public DNS forwarders instead.
# forward-zone:
#     name: "."
#     forward-addr: 1.1.1.1  # Cloudflare
#     forward-addr: 8.8.8.8  # Google
